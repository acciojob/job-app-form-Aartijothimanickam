<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
    
    <form action="/submit" method="post">
      <label for="name">Name* :</label>
      <input type="text" id="name" required /><br />
      <label for="email">Email* :</label>
      <input type="email" id="email" required /><br />
      <label for="gender">gender :</label>
      <input type="radio" required id="male" name="gender" ><label for="male">male</label>
      <input type="radio" required id="female" name="gender" /><label for="female">female</label> <br>
      <label for="laptop">Laptop Brands :</label>
      <select id="laptop" >
        <option>Apple </option>
        <option>Asus</option>
        <option>Hp</option>
      </select><br />
      <label for="age">Age* :</label>
      <input id="age" type="number" required>
      <label for="dob" >Date of Birth* :</label>
      <input id="dob" type="date" required><br>
      <label for="password">Password* :</label>
      <input id="password" type="password" required>
      <br><label for="portfolio">Portfolio :</label>
      <input id="portfolio" type="url"><br>
      <button type="submit">submit</button>
    </form>
	<script type="text/javascript" src="./script.js">
</script>

</body>

</html>
